<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#143054">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <title>لوحة المشرف — طا اككليسيا</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/config.js"></script>
    <script type="module" src="/js/admin.js"></script>
</head>

<body>
    <div class="app-shell">
        <header class="topbar"><a class="brand" href="/" aria-label="طا اككليسيا - الصفحة الرئيسية"><img data-app-logo
                    alt="شعار طا اككليسيا"><span>طا اككليسيا</span><span class="admin-tag">مشرف</span></a><button
                class="quiet-button" data-logout>تسجيل الخروج <span aria-hidden="true">←</span></button></header>
        <main class="dashboard admin-dashboard">
            <p class="eyebrow">نظرة عامة</p>
            <h1>متابعة <em>الطلاب</em></h1>
            <p class="intro">اطّلع على متابعة النهاردة وأيام كل طالب.</p>
            <section class="panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">متابعة النهاردة</p>
                        <h2>ملخص الطلاب</h2>
                    </div><span class="date-label" id="admin-date"></span>
                </div>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">الطالب</th>
                                <th scope="col">الصلاة</th>
                                <th scope="col">الكتاب</th>
                                <th scope="col">الآية</th>
                                <th scope="col">التأمل</th>
                            </tr>
                        </thead>
                        <tbody id="today-body">
                            <tr>
                                <td colspan="5" class="empty-state">جارٍ تحميل بيانات الطلاب…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="form-message" id="admin-message" aria-live="polite"></p>
            </section>
            <section class="history-section">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">استعراض</p>
                        <h2>سجل طالب</h2>
                    </div>
                </div><label class="select-label" for="student-select">اختار الطالب</label><select id="student-select">
                    <option value="">اختار اسمًا من القائمة</option>
                </select>
                <div id="student-history" class="history-list">
                    <p class="empty-state">اختار طالب علشان تشوف سجله.</p>
                </div>
            </section>
        </main>
        <footer class="app-footer"><span>كل يوم، طا اككليسيا صغيرة</span><span aria-hidden="true">✳</span></footer>
    </div>
</body>

</html>
