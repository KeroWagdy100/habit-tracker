<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#143054">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <title>تسجيل الدخول — طا اككليسيا</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/config.js"></script>

    <script type="module" src="/js/auth.js"></script>
</head>

<body>
    <main class="auth-wrap"><a class="brand auth-brand" href="/" aria-label="الصفحة الرئيسية"><img data-app-logo
                alt="شعار طا اككليسيا"><span>طا اككليسيا</span></a>
        <section class="auth-card">
            <p class="eyebrow">أهلًا بعودتك</p>
            <h1>سجّل دخول</h1>
            <!-- <h1>كمّل طريقك<br>طا اككليسيا بطا اككليسيا.</h1> -->
            <form id="login-form" novalidate><label for="username">اسم المستخدم<input id="username" name="username"
                        autocomplete="username" required maxlength="30" dir="ltr"></label><label for="password">كلمة
                    المرور<input id="password" name="password" type="password" autocomplete="current-password" required
                        dir="ltr"></label>
                <p class="form-message" aria-live="polite"></p><button class="button full" type="submit">دخول <span
                        aria-hidden="true">←</span></button>
            </form>
            <p class="auth-foot">لسه معندكش حساب؟ <a href="/register.html">أنشئ حسابك</a></p>
        </section><a class="back-link" href="/">العودة للصفحة الرئيسية</a>
    </main>
</body>

</html>
